{% extends "base.html" %}
{% block title %}Reset Password - College Exam Portal{% endblock %}

{% block content %}
<div class="auth-wrapper d-flex align-items-center justify-content-center">
    <div class="glass-card p-4 p-md-5">
        <div class="text-center mb-4">
            <i class="bi bi-shield-lock-fill display-4 text-primary"></i>
            <h3 class="mt-2 mb-0 fw-bold">Reset Password</h3>
            <p class="text-muted">Enter the OTP sent to <strong>{{ email }}</strong></p>
        </div>

        <form method="POST" action="{{ url_for('auth.reset_password') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="email" value="{{ email }}">

            <div class="mb-3">
                <label class="form-label">6-Digit OTP</label>
                <input type="text" name="otp" class="form-control text-center fs-4"
                       maxlength="6" pattern="[0-9]{6}" placeholder="000000" required>
            </div>

            <div class="mb-3">
                <label class="form-label">New Password</label>
                <input type="password" name="new_password" class="form-control" minlength="6" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Confirm New Password</label>
                <input type="password" name="confirm_password" class="form-control" minlength="6" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                <i class="bi bi-check-circle me-1"></i> Reset Password
            </button>
        </form>

        <p class="text-center mt-4 mb-0 small">
            Didn't get a code? <a href="{{ url_for('auth.forgot_password') }}">Request a new one</a>
        </p>
    </div>
</div>
{% endblock %}
