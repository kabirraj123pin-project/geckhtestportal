{% extends "base.html" %}
{% block title %}Forgot Password - College Exam Portal{% endblock %}

{% block content %}
<div class="auth-wrapper d-flex align-items-center justify-content-center">
    <div class="glass-card p-4 p-md-5">
        <div class="text-center mb-4">
            <i class="bi bi-key-fill display-4 text-primary"></i>
            <h3 class="mt-2 mb-0 fw-bold">Forgot Password</h3>
            <p class="text-muted">Enter your email and we'll send you a reset code</p>
        </div>

        <form method="POST" action="{{ url_for('auth.forgot_password') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" name="email" class="form-control" placeholder="you@college.com" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                <i class="bi bi-send me-1"></i> Send OTP
            </button>
        </form>

        <p class="text-center mt-4 mb-0 small">
            Remembered your password? <a href="{{ url_for('auth.login') }}">Back to Login</a>
        </p>
    </div>
</div>
{% endblock %}
