<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}College Exam Portal{% endblock %}</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">

    <!-- Apply saved dark/light preference BEFORE the page paints, to avoid a flash of the wrong theme -->
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme') || 'light';
            const html = document.documentElement;
            html.setAttribute('data-bs-theme', savedTheme);

            // Setting the background color directly (inline, before any CSS file
            // has even started downloading) is what actually stops the white
            // flash on every page load/navigation — data-bs-theme alone isn't
            // enough because Bootstrap's dark CSS rules don't exist yet until
            // bootstrap.min.css finishes loading from the CDN.
            if (savedTheme === 'dark') {
                html.style.backgroundColor = '#212529';
                html.style.colorScheme = 'dark';
            } else {
                html.style.colorScheme = 'light';
            }
        })();
    </script>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- ===== Dark Mode Toggle (floating button, available on every page) ===== -->
    <button type="button" class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle dark mode">
        <i id="themeToggleIcon" class="bi bi-moon-stars-fill"></i>
    </button>

    <!-- ===== Global Page Loader ===== -->
    <div id="pageLoader" class="page-loader">
        <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <!-- ===== Flash Messages (Toast style) ===== -->
    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1080">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                <div class="toast align-items-center text-bg-{{ 'danger' if category == 'danger' else category }} border-0 show" role="alert">
                    <div class="d-flex">
                        <div class="toast-body">{{ message }}</div>
                        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                    </div>
                </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>

    {% block content %}{% endblock %}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Keep the moon/sun icon in sync with the current theme
        function updateThemeIcon() {
            const theme = document.documentElement.getAttribute('data-bs-theme');
            document.getElementById('themeToggleIcon').className =
                theme === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-stars-fill';
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-bs-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-bs-theme', next);
            localStorage.setItem('theme', next);
            updateThemeIcon();
        }

        updateThemeIcon();
    </script>

    <script>
        // ===== Global Page Loader =====
        // Shows a spinner overlay whenever the person submits a form or clicks a
        // real navigation link, so slower actions (saving, publishing, submitting
        // a test, etc.) never look like the page has frozen.
        const pageLoader = document.getElementById('pageLoader');

        function showPageLoader() {
            pageLoader.classList.add('active');
        }

        document.addEventListener('DOMContentLoaded', function () {
            // Show the loader when any normal form is submitted —
            // EXCEPT forms inside a modal (like delete confirmations). Those
            // already give feedback by closing the modal, and firing our
            // overlay at the same instant the modal fades out is what causes
            // the screen to "blink".
            document.querySelectorAll('form').forEach(form => {
                if (form.closest('.modal')) return;
                form.addEventListener('submit', function () {
                    if (form.checkValidity()) showPageLoader();
                });
            });

            // Show the loader when clicking a real navigation link
            // (skip modal/dropdown triggers, in-page anchors, and new-tab links)
            document.querySelectorAll('a[href]').forEach(link => {
                const href = link.getAttribute('href');
                if (
                    href && href !== '#' && !href.startsWith('#') &&
                    !link.hasAttribute('data-bs-toggle') &&
                    link.getAttribute('target') !== '_blank'
                ) {
                    link.addEventListener('click', showPageLoader);
                }
            });
        });

        // Hide the loader if the page is restored from the browser's cache
        // (e.g. clicking the Back button) — otherwise it could get stuck showing
        window.addEventListener('pageshow', function () {
            pageLoader.classList.remove('active');
        });
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
